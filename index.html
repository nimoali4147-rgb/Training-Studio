<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
     <link href="https://fonts.googleapis.com/css?family=Poppins:100,100i,200,200i,300,300i,400,400i,500,500i,600,600i,700,700i,800,800i,900,900i&display=swap" rel="stylesheet">
      <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="fixed top-0 left-0 w-full bg-gray-900/60 h-20 z-20">
             <!-- navbar-->
        <nav class="h-full">
            <div class="max-w-7xl mx-auto px-6 h-full flex justify-around items-center">
                <!-- logo -->
                <div class="font-bold text-3xl md:text-3xl">
                    <span class="text-white">TRAINING</span>
                    <span class="text-red-400">STUDIO</span>
                </div>
               
                  <!-- desktop menu -->
                <div class="hidden md:flex gap-8 text-white font-bold h-20 items-center text-lg ">
                    <a href="#home" class="font-semibold hover:text-red-400">Home</a>
                    <a href="#about" class="font-semibold hover:text-red-400">About</a>
                   <a href="#classes" class="font-semibold hover:text-red-400">Classes</a>
                   <a href="#schedules" class="font-semibold hover:text-red-400">Schedules</a>
                    <a href="#contact" class="font-semibold hover:text-red-400">Contact</a>
                    <a href="#contact" class="font-semibold hover:text-red-400">Sign Up</a>
                </div>

                        <!-- hambager -->
                <div class="md:hidden text-white text-2xl">
                    <i class="fa-solid fa-bars text-blue-600"></i>
                    <i class="fa-solid fa-close w-9 h-9 bg-blue-400 rounded-full text-center justify-center"></i>
                </div>
    
               
            </div>
        </nav>

                <!-- Mobile menu -->
            <div id="mobile-menu" class="hidden md:hidden bg-slate-900 px-6 pb-6">
            <div class="flex flex-col gap-4 pt-3">
                <a href="#home" class="mobile-link text-white font-semibold">Home</a>
                <a href="#about" class="mobile-link text-white font-semibold">About</a>
                <a href="#classes" class="mobile-link text-white font-semibold">Classes</a>
                <a href="#schedule" class="mobile-link text-white font-semibold">Schedules</a>
                <a href="#contact" class="mobile-link text-white font-semibold">Contact</a>
                <a href="#contact" class="mobile-link bg-red-400 text-white text-center px-4 py-2 font-semibold">Sign Up</a>
            </div>
            </div>
      
    </header>

    <section id="home" class="relative h-[85vh] w-full overflow-hidden flex items-center justify-center text-center">

        <!-- Background Video -->
        <video
            class="w-full h-full absolute inset-0 object-cover"
            autoplay
            muted
            loop
            playsinline 
        >
            <source src="video.mp4" type="video/mp4">
        </video>

        <!-- Overlay -->
        <div class="absolute inset-0 bg-black/50 z-10"></div>

        <!--Hero Content-->
        <div class="relative z-10 text-white px-4 mt-20">
            <h2 class="text-xl font-bold tracking-wider">WORK HARDER, GET STRONGER</h2>
            <div class="text-4xl md:text-6xl my-4 font-bold">
                <span>EASY WITH OUR </span><span class="text-red-400">GYM</span>  
            </div>
            <button class="bg-red-400 px-6 py-3 mt-4 text-white text-md font-bold tracking-wide rounded-sm">BECOME A MEMBER</button>
        </div>

     </section>


</body>
</html>
